<style>
/* 法則ハンター — 調査ノートと標本カード。点の方眼のノート、二重枠の標本ラベル、蛍光ペンの「発見」、手書きの書き込み。
   カードの色は 赤 = 塗り・青 = 斜線・緑 = 点 で、色が分からなくても見分けられる。中央480pxの一列。 */
:root{
  --bg:#ECEFEA; --dot:rgba(28,40,34,.13);
  --paper:#FBFCFA; --paper-2:#F3F6F1; --paper-3:#E4E9E2;
  --ink:#17211C; --ink-2:#435049; --ink-3:#5F6B64; --ink-inv:#F6F8F4;
  --rule:rgba(23,33,28,.13); --rule-2:rgba(23,33,28,.26); --rule-3:rgba(23,33,28,.52);
  --pri:#17211C; --pri-ink:#F6F8F4; --pri-2:#2D3B34;
  --mark:#F2D04B; --mark-wash:rgba(242,208,75,.45); --mark-ink:#7A5600;
  --err:#A3245C; --err-wash:rgba(163,36,92,.09);
  --card:#FFFFFF; --card-edge:rgba(23,33,28,.22); --card-back:#24312B; --card-back-2:#34463D; --card-back-ink:#F2D04B;
  --c-red:#D2412F; --c-blue:#2B5FC4; --c-green:#1F8A55;
  --sh-1:0 1px 0 rgba(23,33,28,.05),0 10px 22px -16px rgba(23,33,28,.42);
  --sh-2:0 1px 0 rgba(23,33,28,.06),0 18px 30px -20px rgba(23,33,28,.55);
  --sh-up:0 -12px 28px -20px rgba(23,33,28,.55);
  --scrim:rgba(236,239,234,.95);
  --knob:#FFFFFF; --knob-on:#FFFFFF;
  --f-body:"M PLUS 2","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-hand:"Klee One","Hiragino Maru Gothic ProN","M PLUS 2","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"Courier Prime",ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --dot:rgba(214,232,222,.075);
    --paper:#18211D; --paper-2:#1D2823; --paper-3:#27332D;
    --ink:#E6EDE8; --ink-2:#B3C1B9; --ink-3:#8E9D95; --ink-inv:#0F1513;
    --rule:rgba(230,237,232,.12); --rule-2:rgba(230,237,232,.26); --rule-3:rgba(230,237,232,.5);
    --pri:#E6EDE8; --pri-ink:#0F1513; --pri-2:#C8D4CD;
    --mark:#E5C443; --mark-wash:rgba(229,196,67,.24); --mark-ink:#F0D468;
    --err:#F07CA8; --err-wash:rgba(240,124,168,.12);
    --card:#1B2420; --card-edge:rgba(230,237,232,.22); --card-back:#2C3A33; --card-back-2:#3B4D44; --card-back-ink:#E5C443;
    --c-red:#E25B47; --c-blue:#5F88EA; --c-green:#2FA96B;
    --sh-1:0 1px 0 rgba(0,0,0,.2),0 12px 24px -16px rgba(0,0,0,.8);
    --sh-2:0 1px 0 rgba(0,0,0,.24),0 18px 32px -18px rgba(0,0,0,.85);
    --sh-up:0 -12px 28px -18px rgba(0,0,0,.85);
    --scrim:rgba(15,21,19,.95);
    --knob:#B3C1B9; --knob-on:#0F1513;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --dot:rgba(214,232,222,.075);
  --paper:#18211D; --paper-2:#1D2823; --paper-3:#27332D;
  --ink:#E6EDE8; --ink-2:#B3C1B9; --ink-3:#8E9D95; --ink-inv:#0F1513;
  --rule:rgba(230,237,232,.12); --rule-2:rgba(230,237,232,.26); --rule-3:rgba(230,237,232,.5);
  --pri:#E6EDE8; --pri-ink:#0F1513; --pri-2:#C8D4CD;
  --mark:#E5C443; --mark-wash:rgba(229,196,67,.24); --mark-ink:#F0D468;
  --err:#F07CA8; --err-wash:rgba(240,124,168,.12);
  --card:#1B2420; --card-edge:rgba(230,237,232,.22); --card-back:#2C3A33; --card-back-2:#3B4D44; --card-back-ink:#E5C443;
  --c-red:#E25B47; --c-blue:#5F88EA; --c-green:#2FA96B;
  --sh-1:0 1px 0 rgba(0,0,0,.2),0 12px 24px -16px rgba(0,0,0,.8);
  --sh-2:0 1px 0 rgba(0,0,0,.24),0 18px 32px -18px rgba(0,0,0,.85);
  --sh-up:0 -12px 28px -18px rgba(0,0,0,.85);
  --scrim:rgba(15,21,19,.95);
  --knob:#B3C1B9; --knob-on:#0F1513;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{
  margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;
  font-family:var(--f-body);font-size:15px;line-height:1.7;color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1px,transparent 1.5px);
  background-size:18px 18px;background-position:9px 9px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.vh{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;margin:-1px!important;padding:0!important;border:0!important}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.tnum{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
a{color:var(--ink)}
.hl{background:linear-gradient(transparent 52%,var(--mark-wash) 52%,var(--mark-wash) 92%,transparent 92%);padding:0 .1em}

#app{max-width:480px;margin:0 auto;padding:0 16px calc(36px + env(safe-area-inset-bottom));position:relative}
/* 調査の画面は、下の帯の高さ（--bar-h。画面の JS が帯の大きさに合わせて入れる）だけ下をあける */
body[data-view="play"] #app{padding-bottom:calc(var(--bar-h, 170px) + 20px)}
.view{animation:view-in .34s var(--ease) both}
@keyframes view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- ボタン（ラベルの札のように角の締まった形） ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;
  border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);
  font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.3;text-align:center;
  transition:transform .15s var(--ease),background-color .2s,color .2s,box-shadow .2s,opacity .2s;
}
.btn:hover{background:var(--paper-2)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn .i{width:19px;height:19px}
.btn-pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 8px 16px -12px rgba(0,0,0,.6)}
.btn-pri:hover{background:var(--pri-2)}
.btn-ghost{background:transparent;border-style:dashed;border-color:var(--rule-3)}
.btn-ghost:hover{background:var(--paper)}
.btn-danger{background:var(--err);border-color:var(--err);color:#fff}
:root[data-theme="dark"] .btn-danger{color:#0F1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-danger{color:#0F1513}}
.btn[disabled]{opacity:.42;cursor:default;box-shadow:none}
.btn[disabled]:active{transform:none}
.btn-wide{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);transition:background-color .2s,transform .15s}
.icon-btn:hover{background:var(--paper-3)}
.icon-btn:active{transform:scale(.92)}
.icon-btn .i{width:22px;height:22px}

/* ---------- ホーム ---------- */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:48px;height:48px;flex:none}
.logo .lg-bg{fill:#17211C;stroke:var(--rule-2);stroke-width:1}
.logo .lg-card{fill:#FBFCFA}
.brand-name{font-family:var(--f-hand);font-weight:600;font-size:27px;line-height:1.15;letter-spacing:.06em}
.brand-sub{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;margin-top:2px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

.home-note{display:grid;gap:8px;margin-bottom:12px}
.hn{display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 12px;border:1px solid var(--rule-2);border-left:4px solid var(--mark);border-radius:4px;background:var(--paper);text-align:left;color:var(--ink)}
.hn .i{margin-top:2px;color:var(--mark-ink)}
.hn b{display:block;font-size:14px}
.hn small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.55}
button.hn{cursor:pointer}
button.hn > .i:last-child{margin-left:auto;align-self:center;color:var(--ink-3)}

/* 今日のルール = 標本ラベル（二重枠・ピン留め） */
.today{position:relative;margin:14px 0 6px;padding:20px 16px 16px;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;box-shadow:var(--sh-2)}
.today::before{content:"";position:absolute;inset:4px;border:1px solid var(--rule-2);border-radius:1px;pointer-events:none}
.pin{position:absolute;top:-8px;left:24px;width:16px;height:16px;border-radius:50%;background:var(--mark);box-shadow:inset -2px -3px 0 rgba(0,0,0,.18),0 3px 4px -1px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;left:5px;top:3px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.7)}
.today-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative}
.today-title{font-family:var(--f-hand);font-weight:600;font-size:25px;line-height:1.25;margin-top:4px;letter-spacing:.04em}
.today-lead{font-size:13px;color:var(--ink-2);margin-top:4px;max-width:15em}
.today-deco{width:104px;height:78px;flex:none;margin:-6px -4px 0 0}
.today-deco .td-c{fill:var(--card);stroke:var(--card-edge)}
.tfields{display:grid;grid-template-columns:auto auto 1fr;gap:0;margin:14px 0 14px;border-top:1px dashed var(--rule-2);border-bottom:1px dashed var(--rule-2);position:relative}
.tfields > div{padding:8px 14px 8px 0;margin-right:14px;border-right:1px dashed var(--rule-2)}
.tfields > div:last-child{border-right:0;margin-right:0;padding-right:0}
.tfields small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.tfields b{display:block;font-size:15px;line-height:1.4;white-space:nowrap}
.tfields .tf-no{font-family:var(--f-mono);font-size:21px;line-height:1.2}
.tstatus{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:14px;font-size:13.5px;color:var(--ink-2);position:relative}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:3px;font-size:12.5px;font-weight:700;border:1px solid var(--rule-3);color:var(--ink)}
.chip.go{background:var(--mark-wash);border-color:transparent}
.chip.ok{background:var(--ink);color:var(--ink-inv);border-color:var(--ink)}
.chip .i{width:15px;height:15px}
.today .btn{position:relative}

.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.stars svg{width:15px;height:15px}
.stars .on{fill:var(--ink)}
.stars .off{fill:none;stroke:var(--rule-3);stroke-width:1.6}

.streak{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:10px 2px 4px;font-size:13px;color:var(--ink-2)}
.streak b{color:var(--ink);font-size:15px}
.streak .fire{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--ink)}
.streak .fire .i{color:var(--mark-ink)}
.streak .fire.off .i{color:var(--ink-3)}

.sec{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-head h2{font-size:16px;font-weight:800;letter-spacing:.04em}
.sec-head small{font-size:12px;color:var(--ink-3)}
.prac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:96px;padding:12px 10px 10px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);text-align:left;transition:transform .18s var(--ease),box-shadow .2s,background-color .2s}
.pr:nth-child(2){border-radius:4px 14px 4px 4px}
.pr:nth-child(3){border-radius:4px 4px 14px 4px}
.pr:hover{transform:translateY(-2px);box-shadow:var(--sh-1)}
.pr:active{transform:translateY(0) scale(.98)}
.pr b{font-size:14.5px;line-height:1.35}
.pr small{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.pr .badge{position:absolute;top:-8px;right:8px;padding:0 7px;border-radius:3px;background:var(--mark);color:#2A2200;font-size:11px;font-weight:800;line-height:18px}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.menu button{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper);font-weight:700;font-size:14.5px;text-align:left;transition:background-color .2s,transform .15s,border-color .2s}
.menu button:hover{border-color:var(--ink);background:var(--paper-2)}
.menu button:active{transform:scale(.98)}
.menu button .i{color:var(--ink-2)}
.menu small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.foot-note{margin-top:18px;font-size:12px;color:var(--ink-3);text-align:left}

/* はじめての調査の入口（フィールドノートの1ページ） */
.tut-card{position:relative;margin:4px 0 8px;padding:16px 16px 14px;background:var(--paper);border:1px solid var(--rule-2);border-radius:4px 4px 16px 4px;box-shadow:var(--sh-1);
  background-image:linear-gradient(var(--paper),var(--paper)),repeating-linear-gradient(transparent 0 25px,var(--rule) 25px 26px);background-clip:padding-box}
.tut-card .eyebrow{color:var(--mark-ink)}
.tc-h{font-family:var(--f-hand);font-size:21px;font-weight:600;margin:4px 0 4px;line-height:1.35}
.tc-h small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);margin-left:8px}
.tc-d{font-size:13.5px;color:var(--ink-2);margin-bottom:12px;padding-right:20px}
.tc-x{position:absolute;top:6px;right:6px}
.steps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;counter-reset:s}
.steps li{display:flex;flex-direction:column;gap:4px;padding:8px 8px 7px;border:1px solid var(--rule-2);border-radius:3px;font-size:12px;line-height:1.4;color:var(--ink-2);background:var(--paper)}
.steps li i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-3);font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:12px}
.steps li i .i{width:14px;height:14px}
.steps li.ok{color:var(--ink)}
.steps li.ok i{background:var(--ink);border-color:var(--ink);color:var(--ink-inv)}
.steps li.now{border-color:var(--ink);color:var(--ink);font-weight:700;background:linear-gradient(var(--mark-wash),var(--mark-wash))}
.steps li.now i{border-color:var(--ink)}

/* ---------- 上の帯 ---------- */
.topbar,.pagebar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 0 8px;margin:0 -6px}
.tb-mid{min-width:0;flex:1}
.tb-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12px;color:var(--ink-3);line-height:1.4}
.tb-meta .tnum{font-weight:700;color:var(--ink-2)}
.tb-title{font-family:var(--f-hand);font-weight:600;font-size:19px;line-height:1.3;letter-spacing:.03em}
.pagebar h1{font-family:var(--f-hand);font-weight:600;font-size:21px;letter-spacing:.04em}
.page{padding-bottom:12px}

/* ---------- 案内（はじめての調査）: 手書きのメモ ---------- */
.guide{position:relative;margin:2px 0 12px;padding:12px 14px 12px 44px;border-radius:4px;background:var(--paper);border:1px solid var(--rule-2);box-shadow:var(--sh-1)}
.guide .g-ic{position:absolute;left:12px;top:13px;width:22px;height:22px;color:var(--mark-ink)}
.guide .g-main{font-family:var(--f-hand);font-weight:600;font-size:16px;line-height:1.55}
.guide .g-sub{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.guide .g-sub:empty{display:none}
.guide.miss{border-color:var(--ink);background:linear-gradient(var(--mark-wash),var(--mark-wash)),var(--paper)}
.guide.flash{animation:g-flash .5s var(--ease)}
.bar-guide{grid-column:1/-1;position:relative;padding:5px 9px 6px 30px;border-radius:4px;background:var(--paper);border:1px solid var(--rule-2);animation:g-flash .4s var(--ease)}
.bar-guide .g-ic{position:absolute;left:8px;top:7px;width:16px;height:16px;color:var(--mark-ink)}
.bar-guide .g-main{font-family:var(--f-hand);font-weight:600;font-size:13.5px;line-height:1.45}
.bar-guide .g-sub{font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:1px}
.bar-guide.miss{border-color:var(--ink);background:linear-gradient(var(--mark-wash),var(--mark-wash)),var(--paper)}
@keyframes g-flash{0%{transform:translateY(-4px);opacity:.3}100%{transform:none;opacity:1}}

/* ---------- 候補メーター ---------- */
.meter{position:relative;padding:12px 14px 11px;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;box-shadow:var(--sh-1)}
.meter::after{content:"";position:absolute;inset:3px;border:1px solid var(--rule);pointer-events:none}
.mt-row{display:flex;align-items:baseline;gap:6px;position:relative}
.mt-k{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-right:4px}
.mt-n{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
.mt-u{font-size:13px;color:var(--ink-2)}
.mt-d{margin-left:auto;font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--mark-ink);opacity:0}
.mt-d.show{animation:delta 1.6s var(--ease) both}
@keyframes delta{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.mt-one{margin-left:auto;font-family:var(--f-hand);font-weight:600;font-size:14px;white-space:nowrap}
.mt-bar{position:relative;height:10px;margin:9px 0 8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 10%) ,var(--paper-3);overflow:hidden}
.mt-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:0 2px 2px 0;transition:width .8s var(--ease)}
.mt-bar.one i{background:var(--mark-ink)}
.mt-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px;font-size:12px;color:var(--ink-3);position:relative}
.mt-from{white-space:nowrap}
.pips.judging{color:var(--ink);font-weight:800}
.mt-sep{color:var(--ink-3)}
.pips{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.pips span{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ink)}
.pips i.used{background:transparent;border-color:var(--rule-3)}
.pips i.used.now{animation:pip .5s var(--ease)}
@keyframes pip{0%{transform:scale(1.6)}100%{transform:none}}

/* ---------- 手がかり（○の山・×の山） ---------- */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.pile{min-width:0;padding:9px 8px 10px;border-radius:4px;border:1px solid var(--rule-2);background:var(--paper)}
.pile.ok{border-top:3px solid var(--ink)}
.pile.ng{border-top:3px dashed var(--rule-3)}
.pile h3{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin:0 0 7px 2px}
.pile h3 .ox{width:20px;height:20px}
.pile h3 b{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.pile ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pile .empty{grid-column:1/-1;font-size:12px;color:var(--ink-3);padding:8px 2px}
.cl{position:relative;min-width:0;padding-top:12px}
.cl .sc{width:100%}
.cl .tg{position:absolute;left:0;top:0;z-index:1;min-width:17px;padding:0 4px;height:16px;border-radius:2px;background:var(--ink);color:var(--ink-inv);font-family:var(--f-mono);font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.cl.k-ex .tg{background:var(--paper-3);color:var(--ink-2);font-family:var(--f-body)}
.cl.k-jd .tg{background:transparent;color:var(--ink-2);border:1px solid var(--rule-3);font-family:var(--f-body);line-height:14px}
.cl .fd{position:absolute;right:-3px;top:-1px;z-index:1;padding:0 4px;border-radius:2px;background:var(--mark);color:#2A2200;font-size:10px;font-weight:800;line-height:15px;transform:rotate(-6deg)}
.cl.new{animation:cl-in .7s var(--bounce) both}
@keyframes cl-in{0%{opacity:0;transform:translateY(-14px) scale(.6) rotate(-8deg)}100%{opacity:1;transform:none}}

/* ---------- 標本カード ---------- */
.sc{position:relative;display:block;width:var(--w,56px);aspect-ratio:60/84;background:var(--card);border:1px solid var(--card-edge);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 4px 8px -6px rgba(0,0,0,.35)}
.sc > svg{display:block;width:100%;height:100%}
.sh{stroke-width:1.9;stroke-linejoin:round}
.sh-red{fill:var(--c-red);stroke:var(--c-red)}
.sh-blue{fill:url(#pt-blue);stroke:var(--c-blue)}
.sh-green{fill:url(#pt-green);stroke:var(--c-green)}
.ptl-blue{stroke:var(--c-blue);stroke-width:1.5}
.ptd-green{fill:var(--c-green)}
.sc.blank{border-style:dashed;border-color:var(--rule-3);background:transparent;box-shadow:none;display:grid;place-items:center}
.sc.blank span{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.4;padding:0 6px}
.glyph{width:22px;height:22px;flex:none}

/* ---------- 調べる台（カードを作る） ---------- */
.bench{position:relative;margin-top:12px;padding:14px 14px 12px;background:var(--paper);border:1px solid var(--rule-2);border-radius:4px 4px 4px 18px;box-shadow:var(--sh-1)}
.bench h2{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bench h2 .eyebrow{margin-left:auto;font-size:10.5px}
.bench-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.pickers{display:grid;gap:8px;min-width:0}
.pk{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center}
.pk > span{font-size:11.5px;font-weight:800;color:var(--ink-3);writing-mode:vertical-rl;letter-spacing:.2em;justify-self:center}
.pk-opts{display:grid;gap:5px;min-width:0}
.pk-opts.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pk-opts.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;min-width:0;padding:4px 2px;border:1.5px solid var(--rule-2);border-radius:4px;background:var(--paper);font-size:11.5px;font-weight:700;color:var(--ink-2);transition:border-color .15s,background-color .15s,transform .12s,color .15s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.94)}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--ink-inv)}
.opt[aria-checked="true"] .glyph .sh{stroke:var(--ink-inv)}
.opt[aria-checked="true"] .glyph .sw-bg{fill:var(--card)}
.opt .glyph{width:20px;height:20px}
.opt.num{font-family:var(--f-mono);font-size:19px;color:var(--ink)}
.opt.num[aria-checked="true"]{color:var(--ink-inv)}
.opt[disabled]{opacity:.45;cursor:default}
.prev{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px}
.prev-cap{font-size:12px;line-height:1.35;text-align:center;color:var(--ink-2);min-height:2.7em;max-width:92px}
.flip{width:88px;perspective:800px}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .66s var(--ease)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{position:absolute;inset:0;transform:rotateY(180deg)}
.flip .sc{--w:88px}
.flip .sc.pop{animation:pop .32s var(--bounce)}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}
.stamp{position:absolute;right:-12px;bottom:-10px;width:50px;height:50px;pointer-events:none}
.stamp svg{width:100%;height:100%;display:block}
.stamp .st-bg{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.stamp .st-ring{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2.4}
.stamp .st-ok{fill:none;stroke:var(--ink);stroke-width:5}
.stamp .st-ng{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.flip.on .stamp svg{animation:stamp .5s .42s var(--bounce) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-24deg)}100%{opacity:1;transform:rotate(-8deg)}}
.verdict{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:3px;font-weight:800;font-size:13px;white-space:nowrap;background:var(--ink);color:var(--ink-inv)}
.verdict .ox{width:15px;height:15px}
.verdict.ng{background:transparent;color:var(--ink);border:1.5px dashed var(--ink)}
.guess{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.guess-k{font-size:12px;font-weight:800;color:var(--ink-2);writing-mode:vertical-rl;letter-spacing:.2em;padding:0 1px}
.gs{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 8px;border:1.5px solid var(--rule-2);border-radius:5px;background:var(--paper);font-weight:800;font-size:14px;transition:border-color .15s,background-color .15s,color .15s,transform .12s}
.gs:hover{border-color:var(--ink)}
.gs:active{transform:scale(.97)}
.gs .ox{width:22px;height:22px}
.gs[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--ink-inv)}
.gs[disabled]{opacity:.45;cursor:default}
.ox{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.bench-msg{margin-top:10px;font-size:13px;color:var(--ink-2);line-height:1.6;min-height:1.6em}
.bench-msg b{color:var(--ink)}
.bench-res{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;padding:9px 11px;border-radius:4px;background:var(--paper-2);font-size:13.5px}
.bench-res .arrow{font-family:var(--f-mono);font-weight:700}
.bench-res.found{background:linear-gradient(var(--mark-wash),var(--mark-wash)),var(--paper-2)}
.bench.off .pickers,.bench.off .guess{opacity:.5}
.bench.found{animation:wobble .55s var(--ease)}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-1.2deg)}45%{transform:rotate(1deg)}70%{transform:rotate(-.5deg)}}

/* 発見！の演出 */
.burst{position:fixed;left:50%;top:42%;z-index:30;pointer-events:none;transform:translate(-50%,-50%)}
.burst .b-word{position:relative;display:block;font-family:var(--f-hand);font-weight:600;font-size:46px;letter-spacing:.06em;color:var(--ink);padding:2px 18px;white-space:nowrap;animation:b-word 1.5s var(--ease) both}
.burst .b-word::before{content:"";position:absolute;left:4px;right:4px;top:42%;bottom:6%;background:var(--mark);z-index:-1;transform-origin:left;transform:skewX(-8deg);animation:b-mark .35s .1s var(--ease) both}
.burst svg{position:absolute;left:50%;top:50%;width:240px;height:240px;transform:translate(-50%,-50%);overflow:visible}
.burst .ray{stroke:var(--ink);stroke-width:3;stroke-linecap:round;animation:ray .6s var(--ease) both}
.burst .dot{fill:var(--mark-ink);animation:ray .7s var(--ease) both}
@keyframes b-word{0%{opacity:0;transform:scale(1.8) rotate(-10deg)}18%{opacity:1;transform:scale(1) rotate(-4deg)}80%{opacity:1;transform:rotate(-4deg)}100%{opacity:0;transform:translateY(-14px) rotate(-4deg)}}
@keyframes b-mark{from{transform:skewX(-8deg) scaleX(0)}to{transform:skewX(-8deg) scaleX(1)}}
@keyframes ray{0%{opacity:0;stroke-dasharray:0 40}30%{opacity:1}100%{opacity:0;stroke-dasharray:24 40;stroke-dashoffset:-30}}

/* ---------- 判定 ---------- */
.judge{margin-top:12px;padding:14px 14px 12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;box-shadow:var(--sh-2)}
.judge h2{font-family:var(--f-hand);font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}
.judge h2 .jd-try{font-family:var(--f-mono);font-size:13px;margin-left:auto}
.judge > p{font-size:13px;color:var(--ink-2);margin:4px 0 12px}
.jd{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.jd-i{display:grid;grid-template-columns:20px 48px 1fr auto;align-items:center;gap:10px;padding:8px 8px 8px 6px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper);transition:border-color .2s,background-color .2s}
.jd-i .no{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--ink-3);text-align:center}
.jd-i .sc{--w:48px}
.jd-i .txt{font-size:13.5px;line-height:1.45;min-width:0}
.jd-i .txt small{display:block;font-size:12px;color:var(--ink-3)}
.ox2{display:flex;gap:5px}
.ox2 button{display:grid;place-items:center;width:46px;height:46px;border:1.5px solid var(--rule-2);border-radius:5px;background:var(--paper);color:var(--ink);transition:background-color .15s,border-color .15s,transform .12s}
.ox2 button:hover{border-color:var(--ink)}
.ox2 button:active{transform:scale(.92)}
.ox2 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ink-inv)}
.ox2 button[disabled]{cursor:default}
.ox2 .ox{width:24px;height:24px}
.jd-i.right{border-color:var(--rule-3)}
.jd-i.wrong{border-color:var(--err);background:var(--err-wash)}
.jd-i .mk{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:800;white-space:nowrap;margin-top:1px}
.jd-i .mk .ox,.jd-i .mk .i{width:14px;height:14px}
.jd-i.wrong .mk{color:var(--err)}
.jd-i.right .mk{color:var(--ink-2)}
.jd-i.reveal{animation:jd-in .4s var(--ease) both}
@keyframes jd-in{from{opacity:.2;transform:translateX(-6px)}to{opacity:1;transform:none}}
.jd-msg{margin-top:12px;padding:10px 12px;border-radius:4px;border:1px solid var(--err);background:var(--err-wash);font-size:13.5px;line-height:1.6}
.jd-msg b{color:var(--err)}

/* ---------- 下の帯（調べる・判定へ） ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--scrim);border-top:1px solid var(--rule-2);box-shadow:var(--sh-up);padding:10px 16px calc(10px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar-in{max-width:448px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr;gap:7px 8px;align-items:center}
.bar-in.one{grid-template-columns:1fr}
.bar-in .btn{min-height:52px;padding:8px 10px}
.bar-q{grid-column:1/-1;font-size:13px;line-height:1.5;color:var(--ink-2);padding:0 2px 2px}
.bar-q b{color:var(--ink)}

.loading{display:grid;place-items:center;gap:14px;padding:80px 0;color:var(--ink-2);font-size:14px}
.loading svg{width:56px;height:56px;animation:lens 1.2s ease-in-out infinite}
@keyframes lens{0%,100%{transform:translate(-8px,0) rotate(-8deg)}50%{transform:translate(8px,-4px) rotate(8deg)}}

/* ---------- 結果 ---------- */
.res-hero{position:relative;margin-top:6px;padding:18px 16px 16px;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;box-shadow:var(--sh-2);overflow:hidden}
.res-hero::before{content:"";position:absolute;inset:4px;border:1px solid var(--rule-2);pointer-events:none}
.res-case{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;position:relative;padding-right:84px;min-height:30px}
.solved{position:absolute;right:14px;top:12px;padding:2px 10px;border:2.5px solid var(--ink);border-radius:4px;font-family:var(--f-hand);font-weight:600;font-size:20px;letter-spacing:.2em;transform:rotate(8deg);color:var(--ink)}
.solved.anim{animation:solved .6s .2s var(--bounce) both}
@keyframes solved{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}100%{opacity:1;transform:rotate(8deg)}}
.rule-lab{position:relative;margin:14px 0 4px}
.rule-lab small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--ink-3)}
.rule-text{font-family:var(--f-hand);font-weight:600;font-size:30px;line-height:1.35;letter-spacing:.03em;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
.rule-text span{background:linear-gradient(var(--mark-wash),var(--mark-wash)) no-repeat 0 72%/100% 46%;padding:0 .12em}
.rule-text.anim span{animation:ink-in .8s .35s var(--ease) both}
@keyframes ink-in{from{background-size:0 46%;opacity:.15}40%{opacity:1}to{background-size:100% 46%;opacity:1}}
.res-stars{display:flex;align-items:center;gap:4px;margin:10px 0 4px;position:relative}
.res-k{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-right:6px;letter-spacing:.04em}
.res-st{display:inline-flex;gap:4px}
.res-stars svg{width:30px;height:30px}
.res-stars .on{fill:var(--ink)}
.res-stars .off{fill:none;stroke:var(--rule-3);stroke-width:1.5}
.res-stars.anim svg{animation:star-in .5s var(--bounce) both}
.res-stars.anim svg:nth-child(1){animation-delay:.7s}.res-stars.anim svg:nth-child(2){animation-delay:.85s}.res-stars.anim svg:nth-child(3){animation-delay:1s}
@keyframes star-in{from{opacity:0;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:none}}
.res-msg{font-size:14px;line-height:1.6;position:relative}
.res-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.res-meta span{display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border:1px solid var(--rule-2);border-radius:3px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.res-meta b{color:var(--ink);font-family:var(--f-mono);font-size:14px;line-height:1;margin:0 1px}
.res-meta .i{width:16px;height:16px;align-self:center}
.res-point{position:relative;margin-top:12px;padding:12px 14px;border-radius:4px;background:linear-gradient(var(--mark-wash),var(--mark-wash)),var(--paper-2)}
.res-point-k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.res-point-k .i{width:17px;height:17px;color:var(--mark-ink)}
.res-point-t{font-family:var(--f-hand);font-weight:600;font-size:18px;line-height:1.6;margin-top:4px}
.res-point-s{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.diff{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.diff-k,.res-inline{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.res-inline{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.box{margin-top:14px;padding:14px;background:var(--paper);border:1px solid var(--rule-2);border-radius:4px}
.box > h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.box > h2 .i{color:var(--ink-2)}
.box > p{font-size:13.5px;color:var(--ink-2);line-height:1.65}
.box > p + p{margin-top:6px}

/* 45枚の ○× の一覧 */
.t45{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr));gap:3px;margin-top:6px}
.t45 .h{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink-3);text-align:center;line-height:20px}
.t45 .rh{display:grid;place-items:center}
.t45 .rh .glyph{width:20px;height:20px}
.t45 .c{position:relative;display:grid;place-items:center;height:24px;border-radius:3px;background:var(--paper-2);color:var(--ink-3);font-size:12px}
.t45 .c.y{background:var(--mark-wash);color:var(--ink)}
.t45 .c .ox{width:14px;height:14px}
.t45 .c.me{box-shadow:inset 0 0 0 1.6px var(--ink)}
.t45 .gap{grid-column:1/-1;height:3px}
.t45.anim .c{animation:cell .35s var(--ease) both;animation-delay:calc(var(--k) * 12ms + .3s)}
@keyframes cell{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:12px;border-radius:2px;background:var(--mark-wash)}
.legend i.me{background:transparent;box-shadow:inset 0 0 0 1.6px var(--ink)}

/* ふり返り */
.path{display:flex;align-items:flex-end;gap:6px;height:118px;margin:4px 0 2px;padding:0 2px;border-bottom:1px solid var(--rule-3)}
.path .pb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.path .pb b{font-family:var(--f-mono);font-size:12.5px;line-height:1.2;margin-bottom:3px}
.path .pb i{display:block;width:72%;max-width:34px;border-radius:4px 4px 0 0;background:var(--ink);transform-origin:bottom;animation:grow .6s var(--ease) both}
.path .pb.last i{background:var(--mark-ink)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.path-x{display:flex;gap:6px;padding:0 2px;margin-bottom:10px}
.path-x span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--ink-3)}
.rv-steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.rv-s{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px;border:1px solid var(--rule-2);border-radius:4px}
.rv-s .rv-h{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px}
.rv-s .rv-h b{font-weight:800}
.rv-s .rv-h .tnum{font-weight:700}
.rv-pair{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv-c{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0;padding:6px;border-radius:4px;background:var(--paper-2)}
.rv-who{flex-basis:100%;font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;line-height:1.3}
.luck{grid-column:1/-1;display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.5;color:var(--mark-ink);font-weight:700}
.luck .i{width:15px;height:15px}
.rv-c .sc{--w:34px;flex:none}
.rv-c div{min-width:0;font-size:12px;line-height:1.45;color:var(--ink-2)}
.rv-c div b{display:block;color:var(--ink);font-size:12.5px}
.rv-c.best{background:transparent;border:1px dashed var(--rule-3)}
.okb{display:inline-flex;align-items:center;gap:3px;padding:0 7px;border-radius:3px;font-size:11.5px;font-weight:800;line-height:19px;background:var(--ink);color:var(--ink-inv)}
.okb.no{background:transparent;color:var(--ink-2);border:1px solid var(--rule-3)}
.okb .i{width:13px;height:13px}
.fdb{display:inline-block;padding:0 6px;border-radius:2px;background:var(--mark);color:#2A2200;font-size:11px;font-weight:800;line-height:18px}
.pw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pw-n{font-family:var(--f-mono);font-size:40px;font-weight:700;line-height:1}
.pw-u{font-size:15px;font-weight:700}
.pw-k{font-size:13px;font-weight:800;color:var(--ink-2);align-self:center}
.pw-best{font-size:13px;color:var(--ink-2);margin-left:auto}
.pw-best b,.box > .pw-avg b{color:var(--ink)}
.box > .pw-avg{font-size:13px;color:var(--ink-2);margin:4px 0 6px}
.res-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.res-actions .full{grid-column:1/-1}
.copy-fb{margin-top:10px;padding:10px;border:1px dashed var(--rule-3);border-radius:4px}
.copy-fb p{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.copy-fb textarea{width:100%;border:1px solid var(--rule-2);border-radius:3px;background:var(--paper);padding:8px;font-size:13px;resize:vertical}

/* ---------- 記録帳 ---------- */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:6px;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px}
.tally div{display:flex;flex-direction:column;align-items:flex-start;padding:10px 10px 8px;border-right:1px dashed var(--rule-2)}
.tally div:last-child{border-right:0}
.tally b{font-family:var(--f-mono);font-size:24px;line-height:1.1}
.tally span{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.tally-note{font-size:12.5px;color:var(--ink-2);margin:10px 2px 0;line-height:1.7}
.chart{position:relative;margin-top:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{fill:var(--ink-3);font-family:var(--f-mono);font-size:10px}
.chart .bar-m{fill:var(--ink)}
.chart .bar-m.p{fill:var(--ink-3)}
.chart .avg{stroke:var(--mark-ink);stroke-width:1.6;stroke-dasharray:4 3}
.chart .hit{fill:transparent}
.chart .hit:hover + .bar-m,.chart .hit:focus + .bar-m{fill:var(--mark-ink)}
.chart-tip{position:absolute;pointer-events:none;padding:4px 8px;border-radius:3px;background:var(--ink);color:var(--ink-inv);font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s}
.chart-tip.show{opacity:1}
.chart-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.chart-leg span{display:inline-flex;align-items:center;gap:5px}
.chart-leg i{width:12px;height:10px;border-radius:2px;background:var(--ink)}
.chart-leg i.p{background:var(--ink-3)}
.chart-leg i.a{height:0;border-top:2px dashed var(--mark-ink);border-radius:0}
.book-note{font-size:12.5px;color:var(--ink-3);margin:14px 2px 8px;line-height:1.7}
.ledger{list-style:none;margin:0;padding:0}
.lg-head h3{font-family:var(--f-mono);font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);padding:14px 2px 6px;border-bottom:1px solid var(--rule-2)}
.ledger li button{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;min-height:58px;padding:8px 4px;border:0;border-bottom:1px dashed var(--rule-2);background:transparent;text-align:left;transition:background-color .15s}
.ledger li button:hover{background:var(--paper)}
.lg-no{font-family:var(--f-mono);font-weight:700;font-size:17px;line-height:1.1}
.lg-no small{display:block;font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.lg-mid{min-width:0}
.lg-date{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:13.5px;font-weight:700}
.lg-today{padding:0 6px;border-radius:2px;background:var(--mark);color:#2A2200;font-size:11px;line-height:17px}
.lg-rule{display:block;font-family:var(--f-hand);font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--ink-3);text-align:right}
.lg-end .stars .on{fill:var(--mark-ink)}
.lg-more{margin-top:12px}

/* ---------- ルール図鑑 ---------- */
.zk-sum{display:flex;align-items:baseline;gap:8px;margin-top:6px;padding:14px;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px}
.zk-sum b{font-family:var(--f-mono);font-size:34px;line-height:1}
.zk-sum span{font-size:13px;color:var(--ink-2)}
.zk-sum .zk-bar{flex:1;align-self:center;height:8px;margin-left:8px;border-radius:2px;background:var(--paper-3);overflow:hidden;min-width:40px}
.zk-sum .zk-bar i{display:block;height:100%;background:var(--ink)}
.zk-lv{margin-top:16px}
.zk-lv h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px}
.zk-lv h2 small{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.zk-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px;padding:8px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper)}
.zk-box i{aspect-ratio:1;border-radius:2px;border:1px dashed var(--rule-2)}
.zk-box i.y{border:0;background:var(--ink)}
.zk-box i.y.new{background:var(--mark-ink)}
.zk-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.zk-list li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:9px 12px;border:1px solid var(--rule-2);border-left:3px solid var(--ink);border-radius:3px;background:var(--paper)}
.zk-list .zr{font-family:var(--f-hand);font-weight:600;font-size:16px;line-height:1.4}
.zk-list small{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
.zk-list .zn{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.zk-empty{font-size:13px;color:var(--ink-3);padding:6px 2px}

/* ---------- 遊び方 ---------- */
.page-lead{font-size:14.5px;line-height:1.8;margin:6px 0 4px}
.page > h2{font-size:16px;font-weight:800;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.page > h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--mark);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
.page > p{font-size:14px;line-height:1.8;color:var(--ink-2)}
.page > p + p{margin-top:8px}
.rules{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:14px;line-height:1.75;color:var(--ink-2)}
.rules b{color:var(--ink)}
.patt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.patt div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper);font-size:12.5px;text-align:center}
.patt .glyph{width:34px;height:34px}
.patt small{color:var(--ink-3);font-size:11.5px}
.ex-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:8px 0}
.ex-c{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);text-align:center;min-width:64px;white-space:nowrap}
.nw{white-space:nowrap}
.ex-c .sc{--w:56px}
.ex-c .ox{width:14px;height:14px;vertical-align:-2px}
.ex-steps{list-style:none;margin:8px 0;padding:0;display:grid;gap:8px}
.ex-steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper);font-size:13.5px;line-height:1.6}
.ex-steps .sc{--w:44px}
.ex-steps b{font-family:var(--f-mono)}
.ht-box{margin-top:12px;padding:14px;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper)}
.ht-box .ht-k{font-weight:800;font-size:14.5px}
.ht-box .ht-d{font-size:13px;color:var(--ink-2);margin:4px 0 12px}
.week{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--paper);border:1px solid var(--rule-2)}
.week th,.week td{padding:8px 10px;border-bottom:1px dashed var(--rule-2);text-align:left}
.week th{font-size:12px;color:var(--ink-3);font-weight:700}
.week tr:last-child td{border-bottom:0}
.sg{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sg li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper);font-size:13.5px;line-height:1.5}

/* ---------- 設定 ---------- */
.settings{list-style:none;margin:6px 0 0;padding:0;background:var(--paper);border:1px solid var(--rule-2);border-radius:4px}
.settings li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:12px;padding:14px 14px;border-bottom:1px dashed var(--rule-2)}
.settings li:last-child{border-bottom:0}
.settings li > .i{color:var(--ink-2)}
.settings b{display:block;font-size:14.5px}
.settings small{display:block;font-size:12px;color:var(--ink-3);line-height:1.5}
.settings .seg{grid-column:1/-1}
.switch{position:relative;width:52px;height:30px;border-radius:15px;border:1.5px solid var(--rule-3);background:var(--paper-3);transition:background-color .2s,border-color .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .22s var(--bounce),background-color .2s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--knob-on)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;border-right:1px solid var(--rule-2);background:var(--paper);font-weight:700;font-size:13.5px;transition:background-color .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--ink-inv)}
.seg .i{width:17px;height:17px}
.danger-zone{margin-top:18px}
.confirm{padding:14px;border:1.5px solid var(--err);border-radius:4px;background:var(--err-wash)}
.confirm p{font-size:13.5px;line-height:1.7;margin-bottom:12px}
.confirm .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.about{margin-top:18px;font-size:12.5px;line-height:1.8;color:var(--ink-3)}
.about-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:4px;color:var(--ink-2);font-weight:700;text-decoration:underline;text-decoration-color:var(--rule-3);text-underline-offset:3px;transition:color .18s ease,text-decoration-color .18s ease}
.about-link .i{width:16px;height:16px}
.about-link:hover,.about-link:focus-visible{color:var(--ink);text-decoration-color:currentColor}
/* 毎日の通知（iOS アプリだけ）: 時刻の欄と、許可が無いときの注記 */
.set-sub{grid-column:2 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);animation:view-in .3s var(--ease) both}
.set-sub input[type="time"]{font-family:var(--f-mono);font-size:16px;font-weight:700;color:var(--ink);background:var(--paper-2);border:1.5px solid var(--ink);border-radius:4px;padding:4px 10px;min-height:40px}
.set-note{grid-column:2 / -1;margin:0;font-size:12.5px;line-height:1.5;color:var(--err)}

.toast{position:fixed;left:50%;bottom:calc(var(--bar-h, 0px) + 24px + env(safe-area-inset-bottom));z-index:40;max-width:calc(100% - 32px);padding:10px 16px;border-radius:4px;background:var(--ink);color:var(--ink-inv);font-size:13.5px;line-height:1.5;box-shadow:var(--sh-2);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:359px){
  #app{padding-left:16px;padding-right:16px}
  .brand-name{font-size:23px}
  .today-deco{width:80px;height:60px}
  .tfields > div{padding-right:9px;margin-right:9px}
  .prac{gap:6px}
  .pr{padding:10px 7px 8px}
  .bench{padding:12px 10px 10px}
  .bench-top{gap:10px}
  .prev{width:74px}
  .flip{width:72px}
  .flip .sc{--w:72px}
  .stamp svg{width:52px;height:52px}
  .pk{grid-template-columns:16px 1fr;gap:4px}
  .opt{min-height:44px;font-size:10.5px}
  .opt.num{font-size:17px}
  .pile{padding:8px 6px}
  .pile ul{gap:5px}
  .jd-i{grid-template-columns:16px 40px 1fr auto;gap:7px}
  .jd-i .sc{--w:40px}
  .ox2 button{width:44px;height:44px}
  .rule-text{font-size:25px}
  .tally b{font-size:20px}
  .rv-pair{grid-template-columns:1fr}
  .burst .b-word{font-size:38px}
  .brand-sub{font-size:11.5px;letter-spacing:.02em}
  .logo{width:42px;height:42px}
  .steps li{font-size:11px;padding:7px 6px 6px}
  .gs{font-size:13px;gap:5px;padding:6px 4px}
  .gs .ox{width:18px;height:18px}
  .bar-in .btn{font-size:14px;gap:6px;padding:8px 6px}
  .bar-in .btn .i{width:17px;height:17px}
  .res-actions .btn{font-size:14px;gap:6px;padding:8px 8px}
  .res-case{padding-right:76px}
}
@media (min-width:700px){
  body{font-size:15.5px}
  .masthead{padding-top:28px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .burst{display:none}
}

<script>
// ==ENGINE START==
/* 法則ハンター — 推理エンジン（VERSION 3）
 * カード45枚・ルールの表・問題の生成（例の2枚と公平さの確認）・候補の数え方・最善手・判定の5枚・
 * はじめての調査（tutorial）・遊び方の例（example）・日替わり（daily / dailyConfig）・結果のふり返り（review）・結果の★（grade）。
 * 外部への通信なし。乱数は seed から決まる mulberry32 だけを使う（Math.random は使わない）。
 * 生成は試す回数で打ち切る（時間では打ち切らない）ので、端末の速さで問題が変わらない。
 * DOM・window・localStorage を使わないので、Web Worker の中でもそのまま動く。
 *
 * ■ カード: 色（赤・青・緑）× 形（丸・三角・四角）× 数（1〜5）= 45枚。番号 = 色*15 + 形*5 + (数-1)。
 * ■ ルール: 部品（色が◯／色が◯ではない／形が◯／形が◯ではない／数が k 以上／数が k 以下／偶数／奇数）1つ、
 *   または部品2つの「かつ」「または」。45枚の ○× の表が同じものは1つにまとめ、いちばん簡単な言い方を残す。全部○・全部×は除く（350通り）。
 *   簡単さの順（RULES の並び）: level → cost → 形（1つ・かつ・または）→ 部品の順。
 *     level 1 = 色か形が◯（6）
 *     level 2 = 「ではない」・数の部品1つと、「ではない」を使わない「かつ」（93）
 *     level 3 = それ以外の部品2つ（「ではない」を含むかつ・または。251）
 *     cost    = 部品（色・形が◯ 1、ではない 2、数 2）の和 ＋ かつ 1・または 2
 * ■ 候補の範囲（scope。候補メーターが数えるルールの集まり。★で決まる）
 *     scope 1（★1）= 色と形だけの level 1〜2（◯・◯ではない・◯くて◯）21通り
 *     scope 2（★2）= level 1〜2 すべて 99通り
 *     scope 3（★3）= すべて 350通り
 *   答えのルールは、その★の候補の範囲のどれでもよい（★1 = 21通り・★2 = 99通り・★3 = 350通り。VERSION 3 から）。
 *   候補メーターの数 = 本当にありうる答えの数になり、「★1 なら答えは色か形が◯」のような読みができない。
 *   （公平にできないルールは UNFAIR で外す。今は無い。tools/check-engine.mjs が全数で確かめる）
 * ■ 最善手: まだ答えの分かっていないカードのうち、最悪でも残る候補が最も少ないもの。
 *   同点なら、候補の重み（2^(8-cost)。簡単なルールほど重い）の多い側が軽いもの、それも同じならカード番号の小さいもの。
 * ■ 公平さ（生成時に確かめ、満たさない例の2枚・ルールは捨てる）: 例の2枚のあと、最善手を続けると、上限回数（budget）の中で候補が1つになる。
 *   候補が1つなら、判定のどの5枚も答えが1通りに決まる。
 *     どの★も、最善手の同点をどれを選んでも届く（stats.sure = 1。人がどの最善手を選んでも公平）。
 *     上限は ★1 3回・★2 4回・★3 6回（★3 は VERSION 1 では 5回で、同点のどれでも届く組がほとんど無かった）。
 *   best = エンジンの最善手で候補が1つになるまでの回数（できれば budget - 1 以下の組を選ぶ）。
 *   stats.bestMax = 同点の選び方で回数がいちばん多くなるときの回数（届かない選び方があれば null）。
 * ■ 判定の5枚（VERSION 3 から）
 *   候補が2つ以上: 答えのルールを使わず、残っている候補と分かっているカードだけで選ぶ（答えが候補のどれでも同じ5枚・同じ順）。
 *     まだ分からないカードのうち、候補どうしで答えが割れるカードを優先し、1枚ずつ
 *     （候補が割れる → 見分けられる候補の組が多い → ○と×の両方が入る候補が多い → 割れ方が半々に近い → 色・形・数がまだ出ていない → seed と手がかりで決まる順）
 *     で選ぶ。割れるカードが5枚に足りなければ、残りは候補の全部で答えが同じカード（○と×の両方が入る候補が増えるもの）で埋める。
 *     5枚から答えを推し量ることはできない（どの候補が答えでも同じ5枚が出る）。
 *   候補が1つ: 答えの境目のカード（答えに近いルールと分かれるカード）を選ぶ。○と×の両方を入れる（答えはもう1つに決まっている）。
 * ■ 結果の★（VERSION 3 から）: ★3 = 判定に進んだ時点で候補が1つ・判定を1回で通過・調べた回数が最善の範囲
 *   （best 以下か、毎回が最善手と同じくらい良い1枚）。★2 = 判定を1回で通過（候補が2つ以上のまま進んで当てたときは最高でも★2）。★1 = やり直しあり。
 * ■ 調査力（VERSION 3 から）: 1回の調べで候補を減らせた割合の平均。判定に進んだ時点で候補が2つ以上残っていたら、
 *   「減らせなかった1回」（0）として平均に入れる（調べずに判定へ進むと 0）。bestPower = この問題を最善手で解いたときの値。
 *
 * 使い方（戻り値はどれも JSON にできる素のオブジェクト。返した問題を書き換えても、エンジンには影響しない）
 *   Engine.CARDS                       45枚 [{c:'red'|'blue'|'green', s:'circle'|'triangle'|'square', n:1..5}]
 *   Engine.RULES                       [{id, text, op:'one'|'and'|'or', parts:[部品], mask, size, level, cost, scope}]（簡単な順）
 *                                      部品 = {k:'color'|'shape', v, not} か {k:'num', op:'ge'|'le'|'even'|'odd', v}
 *                                      mask = 45bit の数（カード i が○なら bit i。mask / 2^i を切り捨てて 2 で割った余り）。size = ○の枚数
 *   Engine.generate({seed, star, ruleId?}) 練習の問題。star 1〜3（範囲外は丸める）。ruleId を渡すとそのルールで作る
 *                                      （★は star。ルールがその★の範囲に無ければ、ルールが入るいちばん小さい★）
 *   Engine.daily('YYYY-MM-DD')         今日のルール。no / date / weekday / weekdayLabel が付く
 *   Engine.dailyConfig('YYYY-MM-DD')   { no, date, seed, star, weekday, weekdayLabel, ruleId }（問題を作らずに分かる）
 *                                      no は 2026-10-20 = 1 の通し番号。それより前の日付は 0 以下（No.1 に丸めるのは画面の DAYRULES）
 *   Engine.test(pz, card)              そのカードは○か（true / false。カードが変なら false）
 *   Engine.candidates(pz, obs)         残っている候補のルールの id（簡単な順）。obs = [{card, ok}]。例の2枚は自動で入る。
 *                                      ok は使わず、答えのルールで決め直す（壊れた入力でも答えが候補から消えない）。変なカードは飛ばす
 *   Engine.bestQuestion(pz, obs)       { card, worstLeft }。候補が1つ以下なら { card: null, worstLeft: 候補の数 }
 *   Engine.judgeCards(pz, obs)         判定の5枚 [card×5]（まだ答えの分かっていないカード。同じ入力なら同じ5枚・同じ順。
 *                                      候補が2つ以上なら、答えが候補のどれでも同じ5枚）
 *   Engine.review(pz, obs)             ふり返り { counts:[候補の数…], steps:[{card, ok, before, after, other, lucky, cut, worst, optimal, best:{card, worstLeft}}],
 *                                      power, bestPower, left, best, allOptimal }。
 *                                      worst = そのカードで最悪のとき残る数、other = 逆の答えだったら残った数、optimal = 最善手と同じくらい良い1枚、
 *                                      lucky = 最善の1枚の「最悪で残る数」より少なく残った（運よく減った）、
 *                                      left = 調べ終わったとき（判定に進んだとき）の候補の数、
 *                                      power（調査力）= cut の平均。left が2以上なら 0 を1回分足して平均（0〜1。調べず left も1なら null）、
 *                                      bestPower = 最善手で解いたときの power、best = この答えで最善手を続けたときの回数
 *   Engine.grade(pz, obs, tries)       結果の★（obs = 調べたカード [{card}]、tries = 判定の回数）。3 = 判定1回で通過・判定に進んだ時点で候補が1つ・
 *                                      調べた回数が best 以下か毎回が最善手と同じくらい良い、2 = 判定1回で通過、1 = やり直しあり
 *   Engine.tutorial(1〜3)              はじめての調査（lesson に案内の文）。Engine.example() = 遊び方の例（demo に最善手の流れ）
 *   Engine.cardIndex(card) / Engine.cardText(card) / Engine.ruleById(id) / Engine.table(ruleId)（45枚の ○× を true/false で）
 *   Engine.STAR_GUIDE[★]               遊び方に出す★の説明（1行。候補の範囲と上限だけで、答えの型は書かない）。Engine.BUDGET[★] = 調べる上限
 * 問題（Puzzle）: { v, seed, star, scope, ruleId, ruleText, examples:[{card, ok:true}, {card, ok:false}], budget, best,
 *   stats:{ universe, start, path:[最善手での候補の数…], bestCards:[最善手のカード…], size, level, cost, sure, bestMax } }

        try {
          const r = o.daily[k];
          if (!realDate(k) || k < DAY1 || !isObj(r) || (r.state !== 'playing' && r.state !== 'done')) return;
          const x = cleanDone(cleanPlay(r), r, r.state);
          if (r.openedOnDay === true) x.openedOnDay = true;
          if (r.solvedOnDay === true) x.solvedOnDay = true;
          if (Number.isInteger(r.streak) && r.streak >= 1) x.streak = r.streak;

        } catch (e) { /* この1件だけ捨てる */ }
      });
    }
    if (isObj(o.practice)) {

      if (isObj(p.byStar)) [1, 2, 3].forEach((k) => { d.practice.byStar[k] = cnt(p.byStar[k]); });
      if (isObj(p.cur)) {
        [1, 2, 3].forEach((k) => {
          try {

  async function nativeRestore() {

  function update(fn) {

  /* ---------- 調査・判定の画面の部品 ---------- */
  // ==VIEW START== 調査・判定の画面とコピー文を作る関数。答えのルール（ruleId・ruleText・stats.path・stats.bestCards）は使わない。
  // tools/check-app.mjs が取り出して、いろいろな問題・途中の状態で動かし、解決する前の画面（下の帯・案内も）とコピー文に答えが混ざらないか、
  // 答えだけが違う同じ形の問題で同じ HTML になるかを確かめる
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  const icon = (id, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const oxIcon = (ok, cls) => '<svg class="ox' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#ox-' + (ok ? 'o' : 'x') + '"/></svg>';
  const COLORS = ['red', 'blue', 'green'], SHAPES = ['circle', 'triangle', 'square'];
  const CN = { red: '赤', blue: '青', green: '緑' };
  const SN = { circle: '丸', triangle: '三角', square: '四角' };
  const idxOf = (card) => Engine.cardIndex(card);
  const cardOf = (i) => { const x = Engine.CARDS[i]; return { c: x.c, s: x.s, n: x.n }; };
  const sameCard = (a, b) => idxOf(a) === idxOf(b);
  // カードの中の図形の置き方（サイコロの目のように数が一目で分かる並び）。viewBox 0 0 60 84
  const SPOTS = { 1: [[30, 42]], 2: [[30, 24], [30, 60]], 3: [[17, 20], [30, 42], [43, 64]], 4: [[17.5, 26], [42.5, 26], [17.5, 58], [42.5, 58]], 5: [[16.5, 19], [43.5, 19], [30, 42], [16.5, 65], [43.5, 65]] };
  const r2 = (v) => Math.round(v * 100) / 100;
  function shapeSVG(s, x, y, cls, k) {
    k = k || 1;
    const a = (v) => r2(v);
    if (s === 'circle') return '<circle class="' + cls + '" cx="' + x + '" cy="' + y + '" r="' + a(8.6 * k) + '"/>';
    if (s === 'square') return '<rect class="' + cls + '" x="' + a(x - 8 * k) + '" y="' + a(y - 8 * k) + '" width="' + a(16 * k) + '" height="' + a(16 * k) + '" rx="1.2"/>';
    return '<path class="' + cls + '" d="M' + x + ' ' + a(y - 9.4 * k) + 'L' + a(x + 10.2 * k) + ' ' + a(y + 8 * k) + 'H' + a(x - 10.2 * k) + 'Z"/>';
  }

  const SCALE = { 1: 1.75, 2: 1.4, 3: 1.12, 4: 1.12, 5: 1 };
  function cardSVG(card) {
    const sp = SPOTS[card.n] || SPOTS[1], k = SCALE[card.n] || 1;
    return '<svg viewBox="0 0 60 84" aria-hidden="true" focusable="false">' + sp.map((p) => shapeSVG(card.s, p[0], p[1], 'sh sh-' + card.c, k)).join('') + '</svg>';

      '<div class="mt-foot"><span class="mt-from">全' + all + '通り<span aria-hidden="true"> → </span><span class="vh">のうち、</span>例の2枚で' + start + '通り</span>' + right + '</div></section>';

  // 手がかり（○の山と×の山）。newest = いま足したカードの番号

  // 選ぶボタンの並び（role=radio）。矢印キーで動けるように、選んだもの（無ければ最初）だけを Tab で止まる所にする

  // カードを作る台。予想と［調べる］は下の帯（小さい画面でもスクロールせずに押せるように）

  // 判定の5枚。P.jres があれば答え合わせの結果（外れたカードの答え）を見せる

  // はじめての調査の案内。文はエンジンの lesson。条件に合わない場面では第1話の一般的な文を使う（答えの色・形・数は言わない）

  function copyText(P, streak) {

  // ==VIEW END==

  /* ---------- 日付と表示の小物 ---------- */
  const rawToday = () => Engine.localDateStr(new Date());   // 丸める前の端末の日付
  const today = () => clampDay(rawToday());
  const pendingNow = () => pendingDay(S.daily, today(), new Date().getHours());
  const streakNow = () => shownStreak(S.daily, today(), !!pendingNow());
  // その日のルールの連続日数（その日のうちに解決した日なら、その日で終わる連続。過去の日の結果に今日の連続を出さない）
  const streakOfDay = (d) => streakAt(S.daily, d);
  const pct = (p) => Math.round(p * 100);

  const say = (msg) => { const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); };
  // 描き直しで焦点が消えないように: 焦点のある要素を id か data 属性で覚えておき、描き直したあとに同じものへ戻す（無ければ fallback）
  const FOCUS_KEYS = [['pk', 'v'], ['guess'], ['ans', 'v'], ['set'], ['themeSet'], ['day'], ['star'], ['nav']];
  const kebab = (k) => k.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase());

  }

    const sel = focusSel();
    fn();
    if (had) refocus(sel, fallback);
  }

  /* ---------- テーマ ---------- */
  function applyTheme() {
    const t = S.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');

  /* ---------- 効果音（WebAudio でその場で作る）と振動 ---------- */

  function audioIdle(ms) {

      rays += '<line class="ray" x1="' + (120 + Math.cos(a) * r1).toFixed(1) + '" y1="' + (120 + Math.sin(a) * r1 * 0.7).toFixed(1) + '" x2="' + (120 + Math.cos(a) * r2).toFixed(1) + '" y2="' + (120 + Math.sin(a) * r2 * 0.7).toFixed(1) + '" style="animation-delay:' + (k * 18) + 'ms"/>';
    }
    el.innerHTML = '<svg viewBox="0 0 240 240">' + rays + '</svg><span class="b-word">発見！</span>';
    document.body.appendChild(el);
    fxT.push(setTimeout(() => el.remove(), 1600));
  }
  // 判定へ進む。調べる回数が残っていて、候補がまだ2つ以上なら、下の帯で確かめる（候補が1つなら確かめない）
  function wantJudge() {
    if (!P || P.phase !== 'look') return;
    if (leftOf(P) > 0 && candCount(P) > 1 && !P.confirm) { P.confirm = true; renderBar(); refocus('#btnStay'); return; }
    P.confirm = false;
    P.phase = 'judge';
    P.shown = null;
    newJudge(false);
    saveProgress();
    if (P.phase === 'judge') { renderPlay({ focus: '#judgeH' }); refocus('#judgeH'); scrollToEl('#judge'); say(sentence(['判定テスト', P.jcards.length + '枚に答える'])); }
  }
  // 判定の5枚を出す（これまでの手がかりから決まる。同じ手がかりなら同じ5枚。候補が2つ以上なら答えによらない）
  function newJudge(quiet) {
    P.jcards = Engine.judgeCards(P.pz, knownObs(P));
    P.jans = P.jcards.map(() => null);
    P.jres = null;
    if (!P.jcards.length && !quiet) solve();   // まだ分からないカードが無い（起きない）
  }
  function setAns(k, v) {
    if (!P || P.phase !== 'judge' || P.jres || !(k >= 0 && k < P.jcards.length)) return;
    P.jans[k] = v;
    sfx('tick');
    // その行だけ描き直す
    $$('[data-ans="' + k + '"]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === v)));
    renderBar();
  }
  function check() {
    if (!P || P.phase !== 'judge' || P.jres || P.jans.some((a) => a == null)) return;
    P.tries++;
    const wrong = [];
    P.jcards.forEach((c, k) => { if (Engine.test(P.pz, c) !== P.jans[k]) wrong.push(k); });
    if (!wrong.length) { solve(); return; }
    P.fails.push(P.jcards.slice());
    P.jres = { wrong };
    saveProgress();
    renderPlay({ focus: '#btnRetry' });
    refocus('#btnRetry');
    scrollToEl('#judge');
    sfx('wrong'); buzz('wrong');
    const parts = [P.jcards.length + '枚中' + (P.jcards.length - wrong.length) + '枚正しい', '外れた' + wrong.length + '枚の答えは手がかりに加わった', 'もう一度判定できます'];
    if (P.mode === 'tutorial') parts.push(guideOf(P).main);
    say(sentence(parts));
  }
  function retry() {
    if (!P || P.phase !== 'judge' || !P.jres) return;
    newJudge(false);

    refocus('#judgeH');
    scrollToEl('#judge');

  }
  function solve() {
    const obsE = engineObs(P);

    P.phase = 'done';
    onSolve();
    sfx('solve'); buzz('solve');
    $('#playBar').hidden = true;
    syncBarHeight();
    go('result', { replace: true, animate: true });
  }
  function scrollToEl(sel) {
    const el = $(sel); if (!el) return;
    try { el.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' }); } catch (e) { /* 古いブラウザ */ }
  }

  /* ---------- 結果 ---------- */
  function caseLine() {
    if (P.mode === 'daily') return '<span class="tnum">No.' + P.no + '</span><span>' + esc(dateLabel(P.date)) + '</span>' + diffHTML(P.pz.star);
    if (P.mode === 'practice') return '<span>練習</span>' + diffHTML(P.pz.star);
    return '<span>はじめての調査 第' + P.ep + '話「' + esc(P.pz.lesson.title) + '」</span>';
  }
  function gradeMsg(rv) {
    const best = P.pz.best, n = P.obs.length, left = rv.left;
    if (P.grade === 3) return n <= best ? '見事な調査。' + n + '回の調べで候補を1つに絞り、判定も1回で通過。' : '毎回が最善手と同じくらい良い1枚。候補を1つに絞り、判定も1回で通過。';
    if (P.grade === 2) {
      if (left > 1) return n ? '判定は1回で通過。ただ、判定に進んだときは候補がまだ' + left + '通り残っていた（★3 は候補を1つに絞ってから）。' : '調べずに判定へ進み、1回で通過。候補はまだ' + left + '通りあった（★3 は調べて1つに絞ってから）。';
      return '判定は1回で通過。調べ方はもっと絞れた（最善手なら、この答えは' + best + '回で1つに絞れる）。';
    }

  }
  // 45枚の ○× の一覧。行 = 色×形、列 = 数。調べたカードに枠
  function tableHTML(id, anim) {

    let k = 0;
    COLORS.forEach((c, ci) => {
      if (ci) h += '<span class="gap" aria-hidden="true"></span>';
      SHAPES.forEach((s) => {
        h += '<div role="row" style="display:contents"><span class="rh" role="rowheader">' + glyphSVG(c, s) + '<span class="vh">' + CN[c] + 'の' + SN[s] + '</span></span>';
        for (let n = 1; n <= 5; n++) {
          const i = ci * 15 + SHAPES.indexOf(s) * 5 + n - 1, y = !!tb[i];

  function reviewHTML(rv) {
    const c = rv.counts, max = c[0] || 1;
    const bars = c.map((x, k) => '<div class="pb' + (k === c.length - 1 ? ' last' : '') + '"><b>' + x + '</b><i style="height:' + Math.max(4, Math.round(x / max * 84)) + 'px;animation-delay:' + (k * 90) + 'ms"></i></div>').join('');

      const luck = s.lucky ? '<p class="luck">' + icon('i-spark') + '運よく減った（逆の答えなら' + s.other + '通り残った）</p>' : '';

        '<div class="rv-pair"><div class="rv-c"><span class="rv-who">あなたの1枚</span>' + cardHTML(s.card) + '<div><b>結果 ' + (s.ok ? '○' : '×') + '</b>最悪で残る ' + s.worst + '</div></div>' +
        (tut ? '' : s.best.card ? '<div class="rv-c best"><span class="rv-who">最善の1枚</span>' + cardHTML(s.best.card) + '<div>最悪で残る ' + s.best.worstLeft + '</div></div>' : '<div class="rv-c best"><span class="rv-who">最善の1枚</span><div>もう絞れていた</div></div>') + '</div>' + luck + '</li>';

  // 結果のコピー（答えのルールは書かない）。iframe の中で返事が遅れたときは、手でコピーする欄を出したあとに来た返事を使わない（両方を出さない）
  function copyFn() {
    const text = copyText(P, P.mode === 'daily' && P.rec && P.rec.solvedOnDay ? streakOfDay(P.date) : 0);
    const fb = $('#copyFb');
    const fallback = () => {
      if (!fb) return;

      fb.hidden = false; ta.value = text; ta.focus(); ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) { /* 選択できない環境 */ }
      toast('コピーできない環境です。下の文字を長押しでコピーしてください');
    };
    let settled = false;
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) { settled = true; fallback(); return; }
      navigator.clipboard.writeText(text).then(() => { if (settled) return; settled = true; if (fb) fb.hidden = true; toast('結果をコピーしました（ルールは書いていません）'); }, () => { if (settled) return; settled = true; fallback(); });

      if (FRAMED) setTimeout(() => { if (!settled) { settled = true; fallback(); } }, 1500);
    } catch (e) { if (!settled) { settled = true; fallback(); } }
  }
  function renderResult(animate) {
    if (!P) return;

        (P.mode === 'daily' ? '<button type="button" class="btn btn-ghost full" data-nav="zukan">' + icon('i-box') + 'ルール図鑑を見る</button>' : '');

    say(sentence(['解決', 'ルールは「' + rtext + '」', tut ? 'この話のポイント。' + P.pz.lesson.done : '結果 ★' + nStar]));
  }

  /* ---------- ホーム ---------- */

  function renderHome() {
    const raw = rawToday(), td = today();

    const notes = [];
    if (clockBehind(raw)) notes.push('<p class="hn" role="note">' + icon('i-clock') + '<span><b>端末の日付が<wbr>2026年10月20日より<wbr>前です</b><small>日付を確かめてください。いまは No.1（10月20日）のルールを出しています。</small></span></p>');
    const pend = pendingNow();
    if (pend) {
      // 0〜3時: 前の日に開いたルールがまだ間に合う。途中まで調べたか・開いただけかで書き分け、連続がのびるかも書く
      const pc = dailyOf(pend), pr = S.daily[pend];

      notes.push('<button type="button" class="hn" data-pending="' + pend + '">' + icon('i-clock') + '<span><b>' + (busy ? '昨日の No.' + pc.no + ' が調査中です' : '昨日の No.' + pc.no + ' を開いたままです') + '</b><small>3時までに解決すれば、昨日の分として連続に数えます' +

    }

    else if (!storeOK) notes.push('<p class="hn" role="note">' + icon('i-lock') + '<span><b>記録を保存できない環境です</b><small>遊べますが、閉じると記録は消えます。</small></span></p>');

  // 調査力の推移（最近20問。1本 = 1問の調査力。点線 = 最近20問の平均）
  function powerChartHTML() {
    const L = S.log.slice(-20);
    if (!L.length) return '<p class="tally-note">問題を解決すると、ここに調査力（1回の調べで候補を何割減らせたか）の推移が出ます。</p>';
    const W = 320, H = 120, padL = 30, padB = 18, top = 8, iw = W - padL - 4, ih = H - padB - top;
    const bw = iw / 20, avg = L.reduce((a, e) => a + e.p, 0) / L.length;
    let g = '';
    [0, 50, 100].forEach((v) => { const y = top + ih - v / 100 * ih; g += '<line class="grid" x1="' + padL + '" x2="' + (W - 4) + '" y1="' + y + '" y2="' + y + '"/><text class="axis" x="' + (padL - 5) + '" y="' + (y + 3) + '" text-anchor="end">' + v + '%</text>'; });
    let bars = '';
    L.forEach((e, k) => {
      const h = Math.max(2, e.p * ih), x = padL + k * bw + bw * 0.18, w = bw * 0.64, y = top + ih - h;
      const r = Math.min(3, w / 2);
      const lab = e.d.slice(5).replace('-', '/') + ' ' + (e.m === 'd' ? '日替わり' : '練習') + ' 難しさ★' + e.s + '・調査力 ' + pct(e.p) + '%';
      bars += '<rect class="hit" x="' + (padL + k * bw) + '" y="' + top + '" width="' + bw + '" height="' + ih + '" tabindex="0" role="img" aria-label="' + esc(lab) + '" data-tip="' + esc(lab) + '"/>' +
        '<path class="bar-m' + (e.m === 'p' ? ' p' : '') + '" aria-hidden="true" d="M' + x.toFixed(1) + ' ' + (top + ih) + 'V' + (y + r).toFixed(1) + 'Q' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + r).toFixed(1) + ' ' + y.toFixed(1) + 'H' + (x + w - r).toFixed(1) + 'Q' + (x + w).toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + w).toFixed(1) + ' ' + (y + r).toFixed(1) + 'V' + (top + ih) + 'Z"></path>';
    });
    const ay = top + ih - avg * ih;
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="調査力の推移。最近' + L.length + '問、平均' + pct(avg) + '%">' + g + bars +
      '<line class="avg" x1="' + padL + '" x2="' + (W - 4) + '" y1="' + ay.toFixed(1) + '" y2="' + ay.toFixed(1) + '"/>' +
      '<text class="axis" x="' + padL + '" y="' + (H - 4) + '">古い</text><text class="axis" x="' + (W - 4) + '" y="' + (H - 4) + '" text-anchor="end">新しい</text></svg><span class="chart-tip" id="chartTip" aria-hidden="true"></span></div>' +
      '<div class="chart-leg"><span><i></i>日替わり</span><span><i class="p"></i>練習</span><span><i class="a"></i>最近' + L.length + '問の平均 ' + pct(avg) + '%</span></div>' +
      (S.stats.powerN > L.length ? '<p class="tally-note">これまでの平均 <b>' + pct(S.stats.powerSum / S.stats.powerN) + '%</b>（' + S.stats.powerN + '問）</p>' : '');
  }
