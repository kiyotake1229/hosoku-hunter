      ? sw('notifyMorning', '毎朝の通知', '今日のルールが届いたことを、決まった時刻に知らせる', 'i-bell',
        (st.notifyMorning ? '<div class="set-sub"><label for="notifyTime">知らせる時刻</label><input type="time" id="notifyTime" value="' + esc(st.notifyTime) + '" step="300"></div>' : '') +
        (notiDenied ? '<p class="set-note">通知が許可されていません。iPhone の「設定」→「通知」→「法則ハンター」で許可できます。</p>' : ''))
      : '';
    $('#settingsBody').innerHTML =
      '<ul class="settings">' + sw('sound', '効果音', 'めくる音・発見・解決の音', 'i-sound') +
      sw('haptics', '振動', plug('Haptics') ? '調べる・発見・解決・判定の外れで軽く震える' : '対応している端末だけ（発見・解決で震える）', 'i-vibe') + noti +
      '<li>' + icon('i-sun') + '<span><b id="lb-theme">画面の色</b><small>自動は端末の設定に合わせます</small></span><span></span>' +
      '<div class="seg" role="radiogroup" aria-labelledby="lb-theme">' + radiosHTML([['auto', '自動', 'i-auto'], ['light', 'ライト', 'i-sun'], ['dark', 'ダーク', 'i-moon']].map((x) => ({ v: x[0], cls: '', inner: icon(x[2]) + x[1] })), st.theme, (x) => 'data-theme-set="' + x.v + '"') + '</div></li></ul>' +
      '<div class="danger-zone">' + (confirmOpen
        ? '<div class="confirm" role="alertdialog" aria-labelledby="cfH"><p id="cfH"><b>記録を消しますか？</b><br>日替わりの記録・連続日数・練習の数・ルール図鑑・調査力の推移・はじめての調査の進み具合を消します。設定は残ります。元に戻せません。</p><div class="row"><button type="button" class="btn btn-danger" id="wipeYes">' + icon('i-trash') + '消す</button><button type="button" class="btn" id="wipeNo">やめる</button></div></div>'
        : '<button type="button" class="btn btn-ghost btn-wide" id="wipeAsk">' + icon('i-trash') + '記録を消す</button>') + '</div>' +
      '<p class="about">記録や操作の内容を外部に送ることはありません（外から読むのは文字の書体だけで、Google Fonts から読み込みます）。記録はこの端末の' + (NATIVE ? 'アプリの中' : 'ブラウザの中（localStorage）') + 'だけに保存されます。<br>問題はすべてその場で自動で作り、最善の調べ方で上限の回数のうちに答えが1つに決まることを確かめてから出しています。<br>法則ハンター ・ エンジン版 ' + Engine.VERSION + '<br>' +
      '<a class="about-link" href="' + SITE_URL + 'support.html" target="_blank" rel="noopener">' + icon('i-q') + 'サポート・プライバシーポリシー</a></p>';
  }
  function wipe() {
    update((s) => {
      const keep = s.settings;
      const d = defaults();
      d.settings = keep;
      d.epoch = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // ほかのタブの問題が書き戻さないように
      Object.keys(s).forEach((k) => { delete s[k]; });
      Object.assign(s, d);
    });
    P = null;
    confirmOpen = false;
    renderSettings();
    refocus('#wipeAsk');
    toast('記録を消しました');
  }

  /* ---------- 操作 ---------- */
  document.addEventListener('click', (e) => {
    if (!booted) return;   // iOS アプリで記録を戻している間（最長1.2秒）は押せない
    const t = e.target.closest ? e.target.closest('button, [data-nav]') : null;
    if (!t || t.disabled) return;
    if (t.dataset.nav) { go(t.dataset.nav); return; }
    if (t.dataset.pk) { setPick(t.dataset.pk, t.dataset.v); return; }
    if (t.dataset.guess) { setGuess(t.dataset.guess === '1'); return; }
    if (t.dataset.ans) { setAns(+t.dataset.ans, t.dataset.v === '1'); return; }
    if (t.dataset.pending) { openDaily(t.dataset.pending); return; }
    if (t.dataset.day) { openDaily(t.dataset.day); return; }
    if (t.dataset.star) { openPractice(+t.dataset.star, false); return; }
    if (t.dataset.set === 'notifyMorning') { toggleNotify(); return; }
    if (t.dataset.set) {
      const k = t.dataset.set;
      update((s) => { s.settings[k] = !s.settings[k]; });
      keepFocus(renderSettings);   // 作り直したあとも、押したスイッチに焦点を残す
      if (k === 'haptics') buzz('toggle');
      if (k === 'sound') sfx('tick');
      return;
    }
    if (t.dataset.themeSet) { update((s) => { s.settings.theme = t.dataset.themeSet; }); applyTheme(); keepFocus(renderSettings); return; }
    switch (t.id) {
      case 'tOpen': openDaily(today()); break;
      case 'tutGo': openTutorial(tutNext()); break;
      case 'tutX': update((s) => { s.tutorial.dismissed = true; }); renderTutCard(); refocus('#tOpen'); toast('はじめての調査は「遊び方」からも始められます'); break;
      case 'howTut': openTutorial(S.tutorial.cur ? S.tutorial.cur.ep : S.tutorial.done >= 3 ? 1 : tutNext()); break;
      case 'playBack': go('home'); break;
      case 'resBack': go('home'); break;
      case 'btnAsk': ask(); break;
      case 'btnJudge': wantJudge(); break;
      case 'btnJudgeGo': if (P) { P.confirm = true; wantJudge(); } break;
      case 'btnStay': if (P) { P.confirm = false; renderBar(); refocus('#btnAsk, #btnJudge'); } break;
      case 'btnCheck': check(); break;
      case 'btnRetry': retry(); break;
      case 'btnCopy': copyFn(); break;
      case 'btnHome': go('home'); break;
      case 'btnNext': openPractice(P ? P.pz.star : 1, true); break;
      case 'btnNextTut': openTutorial((P ? P.ep : 0) + 1); break;
      case 'btnToToday': openDaily(today()); break;
      case 'bookMore': bookMore(); break;
      case 'wipeAsk': confirmOpen = true; renderSettings(); refocus('#wipeNo'); break;
      case 'wipeNo': confirmOpen = false; renderSettings(); refocus('#wipeAsk'); break;
      case 'wipeYes': wipe(); break;
      default: break;
    }
  });
  // role=radio の並び: 矢印キーで前後へ動いて選ぶ（Home・End で端へ）。選んだものだけが Tab で止まる
  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (!t || !t.getAttribute || t.getAttribute('role') !== 'radio') return;
    const g = t.closest('[role="radiogroup"]');
    if (!g) return;
    const list = $$('[role="radio"]', g).filter((x) => !x.disabled);
    const i = list.indexOf(t);
    if (i < 0) return;
    let j = -1;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % list.length;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + list.length) % list.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = list.length - 1;
    if (j < 0) return;
    e.preventDefault();
    const next = list[j];
    try { next.focus(); } catch (er) { /* 古いブラウザ */ }
    next.click();
  });
  // 調査力の推移: 棒に触れる・焦点を当てると、その問題の日付と調査力を出す
  function tipAt(el) {
    const tip = $('#chartTip'); if (!tip) return;
    if (!el || !el.dataset || !el.dataset.tip) { tip.classList.remove('show'); return; }
    const box = tip.parentNode.getBoundingClientRect(), r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip;
    tip.style.left = Math.max(70, Math.min(box.width - 70, r.left - box.left + r.width / 2)) + 'px';
    tip.style.top = (r.top - box.top + 6) + 'px';
    tip.classList.add('show');
  }
  document.addEventListener('pointerover', (e) => { if (cur === 'book') tipAt(e.target.closest ? e.target.closest('.hit') : null); });
  document.addEventListener('focusin', (e) => { if (cur === 'book') tipAt(e.target.closest ? e.target.closest('.hit') : null); });
  // 日付が変わった・0〜3時の「昨日のルールが間に合う」が終わった（3時）・時計を直したら、ホーム・記録帳を描き直す
  let lastDay = today(), lastBehind = clockBehind(rawToday()), lastPend = pendingNow();
  function checkDay() {
    const d = today(), behind = clockBehind(rawToday()), pend = pendingNow();
    if (d === lastDay && behind === lastBehind && pend === lastPend) return;
    const changed = d !== lastDay;
    lastDay = d; lastBehind = behind; lastPend = pend;
    if (cur === 'home') { renderHome(); if (changed) toast('日付が変わりました。新しいルールが届いています'); } else if (cur === 'book') renderBook();
  }
  // アプリが裏に回ったら（ブラウザのタブ・iOS アプリ）: 途中を保存し、音を止める。裏で動く演出のタイマー（めくり・メーター）は
  // 止めずに最後の形まで進めるが、音・振動・発見の演出は出さない（sfx・ensureAudio・buzz・discover が document.hidden と away を見る）。
  // 戻ったら日付を確かめる（iOS アプリでは App の appStateChange でも同じことをする）
  function pauseAll() {
    if (cur === 'play' && P && P.phase !== 'done') saveProgress();
    clearTimeout(idleT);
    try { if (AC && AC.state === 'running' && AC.suspend) AC.suspend().catch(() => {}); } catch (e) { /* 音の無い環境 */ }
  }
  function resumeAll() {
    checkDay();
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseAll(); else resumeAll(); });
  window.addEventListener('focus', checkDay);
  setInterval(checkDay, 60000);
  // 別のタブで記録が変わったら、ホーム・記録帳・図鑑・設定の表示を合わせる。
  // 調べている問題が別のタブで先に進んだ（解決した・判定に進んだ・判定をやり直した）ときは、保存から開き直す（判定を消して、また調べられるようにしない）
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY) return;
    const fresh = readStore();
    if (!fresh) return;
    S = fresh;
    applyTheme();
    if (cur === 'play' && P && P.phase !== 'done') {
      const spec = specOf(P), rec = recOf(spec);
      const moved = rec && rec.v === Engine.VERSION && (S.epoch || '') === (P.epoch || '') &&
        (rec.state === 'done' || (rec.judging && P.phase === 'look') || rec.fails.length > P.fails.length);
      if (moved) { startCase(spec, P.pz); toast(rec.state === 'done' ? '別のタブで解決しました' : '別のタブで判定に進みました'); }
      return;
    }
    if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); else if (cur === 'zukan') renderZukan(); else if (cur === 'settings') keepFocus(renderSettings);
  });

  // 毎朝の通知の時刻を変えた（iOS アプリの設定）
  document.addEventListener('change', (e) => {
    if (!e.target || e.target.id !== 'notifyTime') return;
    const v = e.target.value;
    if (!TIME_RE.test(v)) { e.target.value = S.settings.notifyTime; return; }
    update((s) => { s.settings.notifyTime = v; });
    syncNotifications();
    toast('毎朝 ' + v + ' に知らせます');
  });

  /* ---------- 毎朝の通知（iOS アプリの LocalNotifications。端末の中だけで予約する） ----------
     決めた時刻に「今日のルールが届きました」。その日の No.・難しさ・候補の数を入れて（答えのルールは入れない）、今日から NOTI_DAYS 日分を1日ずつ予約する。
     起動・アプリに戻ったとき・設定を変えたときに、このアプリの予約をまとめて取り消してから入れ直す（毎日開いていれば途切れない。NOTI_DAYS 日開かなければ止まる）。
     許可を求めるのは、設定で ON にしたときだけ（toggleNotify）。予約し直し（syncNow）では許可の状態を確かめるだけ */
  const NOTI_BASE = 820000, NOTI_SPAN = 100000;   // 通知の番号 = NOTI_BASE + ルールの No.（このアプリの予約の見分けにも使う）
  const NOTI_DAYS = 28;
  let notiDenied = false, notiChain = Promise.resolve();
  const isMine = (id) => Number.isInteger(id) && id >= NOTI_BASE && id < NOTI_BASE + NOTI_SPAN;
  // 予約する通知の一覧。fromDay から NOTI_DAYS 日分。hm は 'HH:MM'、now（ms）より5秒以上先の時刻だけ
  function morningList(fromDay, hm, now) {
    const t = String(hm).split(':').map(Number), list = [];
    for (let i = 0; i < NOTI_DAYS; i++) {
      const d = Engine.addDays(fromDay, i), cfg = dailyOf(d);
      if (!(cfg.no >= 1) || cfg.no >= NOTI_SPAN) continue;
      const p = parseD(d), at = new Date(p.y, p.m - 1, p.d, t[0], t[1], 0);
      if (!(at.getTime() > now + 5000)) continue;
      const stars = '★'.repeat(cfg.star) + '☆'.repeat(3 - cfg.star);
      list.push({
        id: NOTI_BASE + cfg.no, title: '今日のルールが届きました',
        body: 'No.' + cfg.no + '（難しさ' + stars + '・候補' + Engine.SCOPES[cfg.star].size + '通り）。カードに隠れたルールを見抜こう。',
        schedule: { at, allowWhileIdle: true }, extra: { date: d },
      });
    }
    return list;
  }
  function syncNotifications() {
    const ln = plug('LocalNotifications');
    if (!ln) return Promise.resolve();
    notiChain = notiChain.then(() => syncNow(ln), () => syncNow(ln));
    return notiChain;
  }
  async function syncNow(ln) {
    try {
      // まず、このアプリが前に予約した分をすべて取り消す
      let ids = [];
      try {
        const pend = await ln.getPending();
        ids = ((pend && pend.notifications) || []).map((n) => Number(n.id)).filter(isMine);
      } catch (e) {
        const no = dailyOf(today()).no;
        for (let k = -3; k <= NOTI_DAYS + 3; k++) if (no + k > 0) ids.push(NOTI_BASE + no + k);
      }
      if (ids.length) await ln.cancel({ notifications: ids.map((id) => ({ id })) });
      const st = S.settings, was = notiDenied;
      let perm = null;
      try { perm = await ln.checkPermissions(); } catch (e) { perm = null; }
      const granted = !!perm && perm.display === 'granted';
      // 「許可されていません」の注記: 許可されたら消す（iPhone の設定で許可して戻ってきたときなど）。ON なのに許可が無いときだけ出す
      if (granted) notiDenied = false; else if (st.notifyMorning) notiDenied = true;
      if (was !== notiDenied && cur === 'settings') renderSettings();
      if (!st.notifyMorning || !granted) return;
      const list = morningList(today(), st.notifyTime, Date.now());
      if (list.length) await ln.schedule({ notifications: list });
    } catch (e) { /* 予約できなくても遊べる */ }
  }
  // 設定の「毎朝の通知」: ON にしたときだけ許可を求める。許可されなければ OFF のまま
  async function toggleNotify() {
    const on = !S.settings.notifyMorning;
    const ln = plug('LocalNotifications');
    const back = () => { const f = $('[data-set="notifyMorning"]'); if (f) f.focus(); };   // 作り直したあとも焦点をスイッチに
    if (on && ln) {
      let ok = false;
      try {
        let p = await ln.checkPermissions();
        if (!p || p.display !== 'granted') p = await ln.requestPermissions();
        ok = !!p && p.display === 'granted';
      } catch (e) { ok = false; }
      notiDenied = !ok;
      if (!ok) { if (cur === 'settings') { renderSettings(); back(); } toast('通知が許可されていません'); return; }
    }
    update((s) => { s.settings.notifyMorning = on; });
    if (cur === 'settings') { renderSettings(); back(); }
    buzz('toggle');
    syncNotifications();
    if (on) toast('毎朝 ' + S.settings.notifyTime + ' に知らせます');
  }
  // 通知を押してアプリを開いたら、今日のルールを開く（起動前に届いたものは起動後に）
  let pendingOpen = false;
  function openFromNotice() {
    if (!booted) { pendingOpen = true; return; }
    if (cur === 'play' && P && P.mode === 'daily' && P.date === today()) return;
    openDaily(today());
  }
  if (plug('LocalNotifications') && typeof plug('LocalNotifications').addListener === 'function') {
    try {
      quiet(plug('LocalNotifications').addListener('localNotificationActionPerformed', (a) => {
        const id = a && a.notification ? Number(a.notification.id) : NaN;
        if (isMine(id)) openFromNotice();
      }));
    } catch (e) { /* 無くてもよい */ }
  }
  // iOS アプリが裏に回ったら止めて保存（away の間は音・振動を出さない）。戻ったら日付を確かめ、状態バーの色を当て直し、通知を予約し直す
  if (plug('App') && typeof plug('App').addListener === 'function') {
    try {
      quiet(plug('App').addListener('appStateChange', (st) => {
        if (st && st.isActive === false) { away = true; pauseAll(); return; }
        away = false;
        resumeAll();
        applyTheme();
        syncNotifications();
      }));
    } catch (e) { /* 無ければ visibilitychange だけで止める */ }
  }

  /* ---------- オフライン（Service Worker） ---------- */
  // GitHub Pages などで直接開いたときだけ登録する。登録しないのは:
  //   iOS アプリの中（NATIVE）／Claude Artifact のような iframe・sandbox の中（FRAMED）／http(s) 以外（file: など）／
  //   安全でない接続（https でも localhost でもない）／Service Worker の無いブラウザ
  // 画面の表示が終わってから（load のあと）登録し、失敗しても何もしない（アプリはそのまま動く）
  function registerSW() {
    try {
      if (NATIVE || FRAMED) return;
      if (!/^https?:$/.test(location.protocol) || !window.isSecureContext) return;
      if (!('serviceWorker' in navigator)) return;
      const go = () => { try { quiet(navigator.serviceWorker.register('sw.js')); } catch (e) { /* 何もしない */ } };
      if (document.readyState === 'complete') go();
      else window.addEventListener('load', go, { once: true });
    } catch (e) { /* 何もしない */ }
  }

  /* ---------- 起動 ---------- */
  // 記録が空なら既定の形を保存しておく。iOS アプリで Preferences を読み終える前（restoring）は書かない
  function persistIfEmpty() {
    if (restoring) return;
    let raw = null; try { raw = localStorage.getItem(KEY); } catch (e) { storeOK = false; return; }
    if (!raw && !newerStore) persist();
  }
  function boot() {
    if (booted) return;
    booted = true;
    applyTheme();
    persistIfEmpty();
    show('home');
    if (NATIVE) syncNotifications();
    // iOS アプリ: 画面が出た直後に StatusBar が既定の色に戻すことがあるので、少し後にもう一度当てる
    if (plug('StatusBar')) setTimeout(applyTheme, 900);
    if (pendingOpen) { pendingOpen = false; openFromNotice(); }
    registerSW();   // オフライン用（iOS アプリ・Artifact などでは何もしない）
  }
  if (plug('Preferences')) {
    // iOS アプリ: Preferences から記録を戻してから始める（長くても1.2秒で始める。戻すのが遅れたら、戻ったときに描き直す）
    const t0 = setTimeout(boot, 1200);
    nativeRestore().then((changed) => {
      clearTimeout(t0);
      if (!booted) { boot(); return; }
      persistIfEmpty();
      if (changed) {
        applyTheme();
        if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); else if (cur === 'zukan') renderZukan(); else if (cur === 'settings') renderSettings();
        syncNotifications();
      }
    }, () => { clearTimeout(t0); if (!booted) boot(); else persistIfEmpty(); });
  } else boot();
})();
</script>
</body>
</html>
